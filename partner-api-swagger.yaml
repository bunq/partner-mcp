      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: List of OAuth clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        OauthClient:
