      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: List of notification filter failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        NotificationFilterFailure:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 12345
                              description: "Unique ID of the failure record"
                            created:
                              type: string
                              format: date-time
                              example: "2024-12-10 14:30:00.123456"
                              description: "When the failure was recorded"
                            updated:
                              type: string
                              format: date-time
                              example: "2024-12-10 14:30:15.987654"
                              description: "Last update timestamp"
                            notification_filters:
                              type: array
                              description: "The notification filter configuration that triggered this failure. Empty if the
                                filter has since been deleted."
                              items:
                                type: object
                                properties:
                                  notification_delivery_method:
                                    type: string
                                    example: "URL"
                                    description: "Delivery method of the notification"
                                  notification_target:
                                    type: string
                                    format: uri
                                    example: "https://my.company.com/callback-url"
                                  category:
                                    type: string
                                    example: "MUTATION"
                            category:
                              type: string
                              example: "MUTATION"
                              description: "The category of the failed notification"
                            event_type:
                              type: string
                              example: "MUTATION_CREATED"
                              description: "The event type of the failed notification"
                            object_id:
                              type: integer
                              example: 1001
                              description: "The object id used to generate the body of the notification"
                            exception_message:
                              type: string
                              example: "Connection timeout occurred"
                              description: "The exception bunq encountered when processing the callback"
                            response_code:
                              type:
                              - integer
                              - 'null'
                              example: 500
                              description: "The response code (or null) received from the endpoint"
                            notification_target:
                              type: string
                              format: uri
                              example: "https://my.company.com/callback-url"
                              description: "This is the URL to which the callback will be made"
              example:
                Response:
                - NotificationFilterFailure:
                    id: 12345
                    created: "2024-12-10 14:30:00.123456"
                    updated: "2024-12-10 14:30:15.987654"
                    notification_filters:
                    - category: "PAYMENT"
                      notification_target: "https://partner.example.com/webhooks/bunq"
                    category: "PAYMENT"
                    event_type: "PAYMENT_CREATED"
                    object_id: 1001
                    exception_message: "Connection timeout after 10 seconds"
                    response_code: 500
                    notification_target: "https://partner.example.com/webhooks/bunq"
                - NotificationFilterFailure:
                    id: 12344
                    created: "2024-12-10 13:15:30.654321"
                    updated: "2024-12-10 13:15:30.654321"
                    notification_filters:
                    - category: "MUTATION"
                      notification_target: "https://partner.example.com/webhooks/mutation"
                    category: "MUTATION"
                    event_type: "MUTATION_CREATED"
                    object_id: 2001
                    exception_message: "Webhook endpoint not found"
                    response_code: 404
                    notification_target: "https://partner.example.com/webhooks/mutation"
                Pagination:
                  future_url:
                  newer_url:
                  older_url: "/v1/user/{userId}/notification-filter-failure?older_id=12300"
    post:
      tags:
      - Notification Management
      summary: Retry Failed Notification Deliveries
      description: |
        Retry delivery of failed webhook notifications by specifying their failure IDs.

        **Key Features:**
        - Retry up to 100 failed notifications in a single request
        - Multiple IDs can be provided as comma-separated values
        - Only failed notifications belonging to the specified user can be retried
        - Successfully queued retries will return the failure IDs that were processed

        **Use Cases:**
        - Retry notifications after fixing webhook endpoint issues
        - Bulk retry of failures after maintenance windows
        - Recovery from temporary network or service outages
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: User ID who owns the failed notifications
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notification_filter_failed_ids
              properties:
                notification_filter_failed_ids:
                  type: string
                  description: |
                    Comma-separated list of notification filter failure IDs to retry.
                    Maximum of 100 IDs allowed per request.
                  example: "12345,12346,12347"
                  pattern: '^[0-9]+(,[0-9]+)*$'
            examples:
              single_retry:
                summary: "Retry single failed notification"
                description: "Retry one specific failed notification"
                value:
                  notification_filter_failed_ids: "12345"
              multiple_retries:
                summary: "Retry multiple failed notifications"
                description: "Retry several failed notifications at once"
                value:
                  notification_filter_failed_ids: "12345,12346,12347,12348"
              bulk_retry:
                summary: "Bulk retry (up to 100 IDs)"
                description: "Retry up to 100 failed notifications in one request"
                value:
                  notification_filter_failed_ids: "12345,12346,12347,12348,12349,12350,12351,12352,12353,12354"
      responses:
        '200':
          description: Retry successfully queued. Returns an empty response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items: {}
              example:
                Response: []
        '400':
          description: Bad request - invalid IDs, too many IDs, or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found - one or more failure IDs don't exist or don't belong to the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /user/{userId}/user-information-inquiry:
    get:
      tags:
      - User Information Inquiry
      summary: List User Information Inquiries
      description: |
        Returns all `UserInformationInquiry` objects for the given provisioned user.

        Partners have **read-only** access to inquiries. Inquiries are created internally by bunq
        based on compliance or onboarding triggers — partners cannot create or update them.

        **Merging behavior**: When multiple inquiries are created for the same user under the same
        context, bunq merges them into a single inquiry and appends new entries to it.

        **Polling recommendation**: Use `status=EXPECTING_REPLY_FROM_USER` to find open inquiries
        that still require user action.
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the provisioned user.
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - EXPECTING_REPLY_FROM_USER
            - EXPECTING_REPLY_FROM_BUNQ
            - FINALIZED
        description: |
          Filter by inquiry status (comma-separated values supported):
          - `EXPECTING_REPLY_FROM_USER`: Open inquiries awaiting user action
          - `EXPECTING_REPLY_FROM_BUNQ`: User has responded; bunq is processing
          - `FINALIZED`: Resolved inquiries
        style: form
        explode: false
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Filter by inquiry type, e.g. `USER_PERSON` or `USER_COMPANY` (comma-separated).
        example: "USER_PERSON"
      - name: purpose
        in: query
        required: false
        schema:
          type: string
        description: Filter by inquiry purpose, e.g. `ONBOARDING` (comma-separated).
        example: "ONBOARDING"
      - name: fulfillment_type
        in: query
        required: false
        schema:
          type: string
        description: Filter by fulfillment type (comma-separated).
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: List of user information inquiries
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        UserInformationInquiry:
                          $ref: '#/components/schemas/UserInformationInquiry'
                  Pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                Response:
                - UserInformationInquiry:
                    id: 1001
                    created: "2026-06-01 10:00:00.000000"
                    updated: "2026-06-03 12:30:00.000000"
                    user_id: 12345
                    title: "We need some information from you"
                    subtitle: "Please provide the requested details"
                    purpose: "ONBOARDING"
                    status: "EXPECTING_REPLY_FROM_USER"
                    all_entry:
                    - UserInformationInquiryEntry:
                        id: 2001
                        created: "2026-06-01 10:00:00.000000"
                        updated: "2026-06-01 10:00:00.000000"
                        type: "USER_PERSON_INVOLVEMENT_IN_POLITICS"
                        status: "PENDING"
                        all_data_submitted: []
                        assistant_conversation:
                        context: {}
                        reject_reason:
                        entry_description: "USER_PERSON_INVOLVEMENT_IN_POLITICS"
                    - UserInformationInquiryEntry:
                        id: 2002
                        created: "2026-06-01 10:00:00.000000"
                        updated: "2026-06-01 10:00:00.000000"
                        type: "USER_PERSON_SOURCE_OF_INCOME"
                        status: "PENDING"
                        all_data_submitted: []
                        assistant_conversation:
                        context: {}
                        reject_reason:
                        entry_description: "USER_PERSON_SOURCE_OF_INCOME"
                    assistant_conversation:
                    finn_conversation:
                    time_expiry:
                    external_model_name: "USER_PERSON"
                    external_model_id: 12345
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{userId}/user-information-inquiry/{inquiryId}/partner-user-information-inquiry-entry/{entryId}:
    put:
      tags:
      - User Information Inquiry
      summary: Submit answer for inquiry entry
      description: |
        Submit an answer for a specific `UserInformationInquiryEntry` on behalf of the provisioned
        user. This is how partners provide the information bunq has requested.

        Each entry can be answered with either:
        - **Attachments** (`all_attachment_id`): for document-based entries (e.g. ID verification,
          bank statements). Upload the files first via `POST /user/{userId}/attachment`, then
          pass the resulting attachment IDs here.
        - **Free text** (`answer`): for open-ended questions (e.g. source of income, account
          purpose). Both fields are optional but at least one must be provided.

        After a successful PUT the entry status transitions to `WAITING_FOR_REVIEW`. Once all
        entries in the inquiry are in `WAITING_FOR_REVIEW`, the inquiry status moves to
        `EXPECTING_REPLY_FROM_BUNQ`.

        **Constraints:**
        - Only entries with status `PENDING` can be updated. Submitting against a non-pending
          entry (e.g. `CANCELLED`, `APPROVED`) returns HTTP 400.
        - Attachments must belong to the provisioned user. Passing an attachment owned by a
          different user returns HTTP 400.
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the provisioned user.
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the inquiry the entry belongs to.
      - name: entryId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the entry to submit an answer for.
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all_attachment_id:
                  type: array
                  description: |
                    IDs of attachments to submit for this entry. Upload files first via
                    `POST /user/{userId}/attachment`. Use for document-based entries.
                  items:
                    type: integer
                  example: [1001, 1002]
                answer:
                  type: string
                  description: |
                    Free-text answer for open-ended entries (e.g. source of income,
                    account purpose, involvement in politics).
                  example: "I am not involved in politics."
            examples:
              attachment:
                summary: Submit with attachments
                value:
                  all_attachment_id: [1001, 1002]
              free_text:
                summary: Submit with free-text answer
                value:
                  answer: "I am not involved in politics."
              both:
                summary: Submit with both attachments and answer
                value:
                  all_attachment_id: [1001]
                  answer: "Supporting document attached."
      responses:
        '200':
          description: Entry submitted successfully. Returns the ID of the updated entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          $ref: '#/components/schemas/Id'
              example:
                Response:
                - Id:
                    id: 2001
        '400':
          description: |
            Bad request. Possible causes:
            - Entry is not in `PENDING` status
            - One or more attachment IDs belong to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{userId}/user-information-inquiry/{inquiryId}:
    get:
      tags:
      - User Information Inquiry
      summary: Get User Information Inquiry
      description: |
        Returns the full `UserInformationInquiry` object for the given inquiry ID, including
        all entries and their current status.
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the provisioned user.
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the inquiry to retrieve.
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: User information inquiry details
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        UserInformationInquiry:
                          $ref: '#/components/schemas/UserInformationInquiry'
              example:
                Response:
                - UserInformationInquiry:
                    id: 1001
                    created: "2026-06-01 10:00:00.000000"
                    updated: "2026-06-03 12:30:00.000000"
                    user_id: 12345
                    title: "We need some information from you"
                    subtitle: "Please provide the requested details"
                    purpose: "ONBOARDING"
                    status: "EXPECTING_REPLY_FROM_USER"
                    all_entry:
                    - UserInformationInquiryEntry:
                        id: 2001
                        created: "2026-06-01 10:00:00.000000"
                        updated: "2026-06-03 12:30:00.000000"
                        type: "USER_PERSON_INVOLVEMENT_IN_POLITICS"
                        status: "WAITING_FOR_REVIEW"
                        all_data_submitted:
                        - type: "FREE_TEXT"
                          value: "I am not involved in politics"
                        assistant_conversation:
                        context: {}
                        reject_reason:
                        entry_description: "USER_PERSON_INVOLVEMENT_IN_POLITICS"
                    assistant_conversation:
                    finn_conversation:
                    time_expiry: "2026-07-01 00:00:00.000000"
                    external_model_name: "USER_PERSON"
                    external_model_id: 12345
        '404':
          description: Inquiry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


