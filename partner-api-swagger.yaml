      summary: Create Credit Card
      x-bunq-encryption-required: true
      description: |
        🔒 **Encrypted endpoint** — the request body and response are end-to-end encrypted. See the Encryption section.

        Order a new credit card that can be connected to monetary accounts.
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - $ref: '#/components/parameters/BunqClientEncryptionIv'
      - $ref: '#/components/parameters/BunqClientEncryptionKey'
      - $ref: '#/components/parameters/BunqClientEncryptionHmac'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - second_line
              - type
              - product_type
              properties:
                first_line:
                  type: string
                  description: First line of text on card (max 17 characters)
                  example: "Groceries"
                second_line:
                  type: string
                  description: Second line of text on card (max 17 characters)
                  example: "Business"
                name_on_card:
                  type: string
                  description: User's name as it will appear on the card
                  example: "L. Skywalker"
                preferred_name_on_card:
                  type: string
                  description: User's preferred name for the card
                  example: "Alice"
                type:
                  type: string
                  enum: [MASTERCARD]
                  example: "MASTERCARD"
                  description: "Card network type - currently only MASTERCARD is supported"
                product_type:
                  type: string
                  enum: [MASTERCARD_CREDIT_CO_BRANDED, MASTERCARD_BUSINESS_CO_BRANDED]
                  description: The product type of the card to order.
                  example: "MASTERCARD_CREDIT_CO_BRANDED"
                product_sub_type:
                  type: string
                  enum: ["PARTNER_UNIQUE_ENUM"]
                  description: Indicates the sub_type of the product. Responsible for the card design (physical or in 
                    the Wallet)
                  example: "PARTNER_UNIQUE_ENUM"
                country:
                  type: string
                  description: Country domestic to the card (ISO-3166). Defaults to country of residence of user.
                  example: "NL"
                order_status:
                  type: string
                  enum: [NEW_CARD_REQUEST_RECEIVED, VIRTUAL_DELIVERY]
                  example: "NEW_CARD_REQUEST_RECEIVED"
                  description: |
                    Card delivery status:
                    - `NEW_CARD_REQUEST_RECEIVED`: Physical card will be delivered by post
                    - `VIRTUAL_DELIVERY`: Virtual card for immediate online use
      responses:
        '200':
          description: Credit card created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        CardCredit:
                          $ref: '#/components/schemas/Card'

