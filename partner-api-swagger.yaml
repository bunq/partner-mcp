  /user/{userId}/monetary-account/{accountId}/payment:
    post:
      tags:
      - Payment Management
      summary: Create Payment
      description: |
        Create a new payment from a monetary account to another IBAN.

        **IBAN Payment Features:**
        - For Users belonging to Partners, only internal transfers are allowed between User <> Partner Monetary Accounts
        - For Partners with PSD2 access, external transfers to any IBAN are allowed
        - Description limited to 140 characters
        - Optional merchant reference for tracking
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - counterparty_alias
              - description
              properties:
                amount:
                  type: object
                  description: Amount to transfer (must be positive and less than account balance)
                  required:
                  - value
                  - currency
                  properties:
                    value:
                      type: string
                      example: "25.00"
                      description: Amount in decimal format
                    currency:
                      type: string
                      example: "EUR"
                      description: ISO 4217 currency code. Must be the same with the currency of the account, and the 
                        receiver account.
                counterparty_alias:
                  type: object
                  description: IBAN details of the recipient
                  required:
                  - type
                  - value
                  properties:
                    type:
                      type: string
                      enum: [IBAN]
                      example: "IBAN"
                      description: Must be IBAN for external bank transfers
                    value:
                      type: string
                      example: "DE89370400440532013000"
                      description: Valid IBAN of the recipient bank account. If transfer to another bunq user, IBAN of 
                        the MA still works.
                    name:
                      type: string
                      example: "John Doe"
                      description: Name of the account holder.
                description:
                  type: string
                  description: Payment description (maximum 140 characters for IBAN transfers)
                  example: "Invoice payment INV-2024-001"
                  maxLength: 140
                merchant_reference:
                  type: string
                  description: Optional merchant-specific reference for tracking
                  example: "ORDER-123456"
                  maxLength: 35
            example:
              amount:
                value: "25.00"
                currency: "EUR"
              counterparty_alias:
                type: "IBAN"
                value: "DE89370400440532013000"
                name: "John Doe"
              description: "Invoice payment INV-2024-001"
              merchant_reference: "ORDER-123456"
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1001
                              description: Unique ID of the created payment
              example:
                Response:
                - Id:
                    id: 1001
        '400':
          description: Bad request - invalid parameters or insufficient funds
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: array
                    items:
                      type: object
                      properties:
                        error_description:
                          type: string
                          example: "Invalid IBAN format"
                        error_description_translated:
                          type: string
                          example: "The IBAN format is not valid"
              example:
                Error:
                - error_description: "Invalid IBAN format"
                  error_description_translated: "The IBAN format is not valid"
    get:
      tags:
      - Payment Management
      summary: List Payments
      description: |
        Get all payments (incoming and outgoing) for a specific monetary account.

        **Payment Types Returned:**
        - Outgoing payments (negative amounts)
        - Incoming payments (positive amounts)  
        - All payment methods: IBAN, bunq transfers, card payments, etc.
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: List of payments for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Payment:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1001
                            created:
                              type: string
                              format: date-time
                              example: "2024-12-10 14:30:00.123456"
                            updated:
                              type: string
                              format: date-time
                              example: "2024-12-10 14:30:15.987654"
                            monetary_account_id:
                              type: integer
                              example: 42
                            amount:
                              type: object
                              properties:
                                value:
                                  type: string
                                  example: "-25.00"
                                  description: "Negative for outgoing, positive for incoming"
                                currency:
                                  type: string
                                  example: "EUR"
                            description:
                              type: string
                              example: "Invoice payment INV-2024-001"
                            type:
                              type: string
                              enum: [BUNQ, EBA_SCT, EBA_SDD, IDEAL, SWIFT, FIS]
                              example: "EBA_SCT"
                              description: |
                                Payment processing type:
                                - `BUNQ`: bunq to bunq transfer
                                - `EBA_SCT`: SEPA Credit Transfer (IBAN)
                                - `EBA_SDD`: SEPA Direct Debit
                                - `IDEAL`: iDEAL payment
                                - `SWIFT`: SWIFT wire transfer
                                - `FIS`: Card payment
                            sub_type:
                              type: string
                              enum: [PAYMENT, WITHDRAWAL, REVERSAL, REQUEST, BILLING, SCT, SDD, NLO]
                              example: "SCT"
                              description: SEPA Credit Transfer
                            status:
                              type: string
                              enum: [PENDING, SETTLED, REJECTED, CANCELLED]
                              example: "SETTLED"
                              description: |
                                Current payment status:
                                - `PENDING`: Payment is being processed
                                - `SETTLED`: Payment completed successfully
                                - `REJECTED`: Payment was rejected by bank
                                - `CANCELLED`: Payment was cancelled
                            counterparty_alias:
                              type: object
                              description: Information about the other party
                              properties:
                                iban:
                                  type: string
                                  example: "DE89370400440532013000"
                                name:
                                  type: string
                                  example: "John Doe"
                            balance_after_mutation:
                              type: object
                              description: Account balance after this payment
                              properties:
                                value:
                                  type: string
                                  example: "975.00"
                                currency:
                                  type: string
                                  example: "EUR"
                  Pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                Response:
                - Payment:
                    id: 1001
                    created: "2024-12-10 14:30:00.123456"
                    updated: "2024-12-10 14:30:15.987654"
                    monetary_account_id: 42
                    amount:
                      value: "-25.00"
                      currency: "EUR"
                    description: "Invoice payment INV-2024-001"
                    type: "EBA_SCT"
                    sub_type: "SCT"
                    status: "SETTLED"
                    counterparty_alias:
                      iban: "DE89370400440532013000"
                      name: "John Doe"
                    balance_after_mutation:
                      value: "975.00"
                      currency: "EUR"
                Pagination:
                  future_url: "/v1/user/{userId}/payment?older_id=12300"
                  newer_url:
                  older_url:

