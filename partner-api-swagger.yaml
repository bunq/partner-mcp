  /user/{userId}/attachment:
    post:
      tags:
      - User Management
      summary: Upload attachment
      description: |
        Upload a file attachment for the provisioned user. The resulting attachment ID can then be
        passed to `PUT /user/{userId}/user-information-inquiry/{inquiryId}/partner-user-information-inquiry-entry/{entryId}`
        via `all_attachment_id` to submit documents for an inquiry entry.

        The request body is the **raw binary content** of the file. The content type and an
        optional description are passed as headers, not in the body.

        **Supported content types:** `image/png`, `image/jpeg`, `image/gif`, `application/pdf`
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the provisioned user.
      - name: X-Bunq-Attachment-Description
        in: header
        required: false
        schema:
          type: string
        description: Human-readable description of the attachment.
        example: "Passport scan"
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum: [image/png, image/jpeg, image/gif, application/pdf]
        description: MIME type of the uploaded file.
        example: "image/jpeg"
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Attachment uploaded successfully. Returns the ID to use in inquiry entry submissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          $ref: '#/components/schemas/Id'
              example:
                Response:
                - Id:
                    id: 1001
        '400':
          description: Bad request — unsupported content type or missing body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

