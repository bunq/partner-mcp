            currency:
              type: string
              example: "PLN"
        balance:
          type: object
          properties:
            value:
              type: string
              example: "1000.00"
            currency:
              type: string
              example: "PLN"
        status:
          type: string
          enum: [ACTIVE, BLOCKED, CANCELLED, PENDING_REOPEN]
          example: "ACTIVE"
        sub_status:
          type: string
          enum: [NONE, REDEMPTION_VOLUNTARY]
          example: "NONE"
        alias:
          type: array
          description: Account aliases (like IBAN)
          items:
            type: object
            properties:
              type:
