  /user/{userId}/notification-filter-url:
    post:
      tags:
      - Notification Management
      summary: Create/Update/Delete Notification Filter URLs
      description: |
        Create, update, or delete webhook endpoints to receive notifications for specific events.

        **Important Notes:**
        - This endpoint completely **replaces** all existing notification filters for the user
        - To **add** notifications: Include all existing + new filters in the request
        - To **update** notifications: Include all filters with updated settings  
        - To **delete all** notifications: Send empty array `{}`
        - To **add** notifications for the UserProvisions -> create a session for the user, and use the UserApiKey.id as the "userId" in the request URL

        **Examples:**
        - Current: 3 notification types configured
        - To add 1 more: Send POST with all 4 types (3 existing + 1 new)
        - To remove 1: Send POST with 2 types (excluding the unwanted one)
        - To clear all: Send POST with `{"notification_filters": []}`
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
        description: User ID
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notification_filters
              properties:
                notification_filters:
                  type: array
                  description: Array of notification filters to create
                  items:
                    type: object
                    required:
                    - category
                    - notification_target
                    properties:
                      category:
                        type: string
                        enum: ["PARTNER_USER_PROVISION", "USER_ONBOARDING", "USER_INFORMATION_INQUIRY", "PAYMENT", "CARD",
                          "CARD_TRANSACTION_SUCCESSFUL", "CARD_TRANSACTION_FAILED", "MUTATION"]
                        example: "PAYMENT"
                        description: "Notification category to filter"
                      notification_target:
                        type: string
                        format: uri
                        example: "https://partner.example.com/webhooks/bunq"
                        description: "The webhook URL to receive notifications"
            examples:
              add_notifications:
                summary: "Add notification filters"
                description: "Create multiple notification filters"
                value:
                  notification_filters:
                  - category: "MUTATION"
                    notification_target: "https://your-webhook-endpoint.com/provision-updates"
                  - category: "USER_INFORMATION_INQUIRY"
                    notification_target: "https://your-webhook-endpoint.com/payments"
              update_notifications:
                summary: "Update existing notifications"
                description: "Replace all existing filters with new configuration"
                value:
                  notification_filters:
                  - category: "USER_INFORMATION_INQUIRY"
                    notification_target: "https://your-new-webhook-endpoint.com/payments"
                  - category: "MUTATION"
                    notification_target: "https://your-new-webhook-endpoint.com/mutations"
                  - category: "PAYMENT"
                    notification_target: "https://your-new-webhook-endpoint.com/payments"

              remove_all_notifications:
                summary: "Remove all notification filters"
                description: "Delete all webhook notification filters"
                value:
                  notification_filters: []
      responses:
        '200':
          description: Notification filter URLs created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        NotificationFilterUrl:
                          type: object
                          properties:
                            category:
                              type: string
                              enum: ["PARTNER_USER_PROVISION", "USER_ONBOARDING", "USER_INFORMATION_INQUIRY", "PAYMENT", "CARD",
                                "CARD_TRANSACTION_SUCCESSFUL", "CARD_TRANSACTION_FAILED", "MUTATION"]
                              example: "MUTATION"
                              description: "Notification category"
                            all_user_id:
                              type: array
                              items:
                                type: integer
                              example: []
                              description: "List of user IDs this filter applies to (typically empty)"
                            all_monetary_account_id:
                              type: array
                              items:
                                type: integer
                              example: []
                              description: "List of monetary account IDs this filter applies to (typically empty)"
                            all_verification_type:
                              type: array
                              items:
                                type: string
                              example: []
                              description: "List of verification types (typically empty)"
                            notification_target:
                              type: string
                              format: uri
                              example: "https://webhook.site/callback"
                              description: "The webhook URL to receive notifications"
              example:
                Response:
                - NotificationFilterUrl:
                    category: "MUTATION"
                    all_user_id: []
                    all_monetary_account_id: []
                    all_verification_type: []
                    notification_target: "https://webhook.site/callback"
                - NotificationFilterUrl:
                    category: "USER_INFORMATION_INQUIRY"
                    all_user_id: []
                    all_monetary_account_id: []
                    all_verification_type: []
                    notification_target: "https://webhook.site/callback"
        '400':
          description: Bad request - invalid URL or category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
