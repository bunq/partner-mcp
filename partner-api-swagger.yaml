          example: NL
        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR
        display_name:
          type: string
          description: Legal name of the account holder.
          example: John Doe
        daily_limit:
          type: object
          properties:
            value:
              type: string
              example: '1000.00'
            currency:
              type: string
              example: EUR
        transaction_limit:
          type:
          - object
          - 'null'
          properties:
            value:
              type: string
              example: '1000.00'
            currency:
              type: string
              example: EUR
