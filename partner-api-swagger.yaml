        credit_line:
          type:
          - object
          - 'null'
        all_access:
          type: array
          items:
            type: object
        share:
          type:
          - object
          - 'null'
          description: Share details if this account is shared.
        all_auto_save_id:
          type: array
          items:
            type: object
          description: Auto-save configurations linked to this account.
        fulfillments:
          type: array
          items:
            type: object
        relation_user:
          type:
          - object
          - 'null'
          description: Relation user linked to this account, or null.
        reason:
          type:
          - string
          - 'null'
          description: Closure reason. Only present when status is CANCELLED.
          enum:
          - OTHER
        reason_description:
          type:
          - string
          - 'null'
          description: Human-readable closure reason description.
  parameters:
    CacheControl:
      name: Cache-Control
      in: header
      required: false
      schema:
        type: string
        default: no-cache
    UserAgent:
      name: User-Agent
      in: header
      required: false
      schema:
        type: string
        example: bunq-partner-client/1.0
    BunqLanguage:
      name: X-Bunq-Language
      in: header
      required: false
      schema:
        type: string
        default: en_US
    BunqRegion:
      name: X-Bunq-Region
      in: header
      required: false
      schema:
        type: string
        default: NL
    BunqGeolocation:
      name: X-Bunq-Geolocation
      in: header
      required: false
      schema:
        type: string
        example: 0 0 0 0 NL
    BunqClientRequestId:
      name: X-Bunq-Client-Request-Id
      in: header
      required: false
      schema:
        type: string
        example: unique-request-id-123
    BunqClientAuthentication:
      name: X-Bunq-Client-Authentication
      in: header
      required: true
      schema:
        type: string
        description: Session token from POST /session-server
    BunqClientSignature:
      name: X-Bunq-Client-Signature
      in: header
      required: true
      schema:
        type: string
        description: HMAC-SHA256 signature of request
    BunqClientEncryptionIv:
      name: X-Bunq-Client-Encryption-Iv
      in: header
      required: true
      description: |
        Encryption header (required on encrypted endpoints). Base64-encoded 16-byte AES initialization vector.
      schema:
        type: string
        example: "Y3Fjy0aYmFzZTY0aXY="
    BunqClientEncryptionKey:
      name: X-Bunq-Client-Encryption-Key
      in: header
      required: true
      description: |
        Encryption header (required on encrypted endpoints). Base64-encoded, RSA-encrypted AES key.
      schema:
        type: string
        example: "cmFuZG9tYWVza2V5YmFzZTY0..."
    BunqClientEncryptionHmac:
      name: X-Bunq-Client-Encryption-Hmac
      in: header
      required: true
      description: |
        Encryption header (required on encrypted endpoints). Base64-encoded HMAC-SHA1 of the IV concatenated with the ciphertext.
      schema:
        type: string
        example: "aG1hY3NoYTFiYXNlNjQ="
paths:
  /installation:
    post:
      tags:
      - Authentication
      summary: Create Installation
      description: |
        Create a new installation by providing your public key. This is the only endpoint that doesn't require authentication headers.

        The server creates an installation and returns:
        - Installation ID
        - Installation token (for device/session creation)
        - Server public key (for verifying response signatures)
      security: []
      parameters:
      - &id001
        $ref: '#/components/parameters/CacheControl'
      - &id002
        $ref: '#/components/parameters/UserAgent'
      - &id003
        $ref: '#/components/parameters/BunqLanguage'
      - &id004
        $ref: '#/components/parameters/BunqRegion'
      - &id005
        $ref: '#/components/parameters/BunqGeolocation'
      - &id006
        $ref: '#/components/parameters/BunqClientRequestId'
      - &id007
        $ref: '#/components/parameters/BunqClientAuthentication'
      - &id008
        $ref: '#/components/parameters/BunqClientSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - client_public_key
              properties:
                client_public_key:
                  type: string
                  description: Your RSA public key in PEM format
                  example: |
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8NzhlzuWGBtrYEvBPwr4
                    XOEK6mMppNM870coBufxUc0zHsmY3qoQD7PkUZMFBZ5Gv/DQMKc1Xj94Fbw3Glqe
                    VvGb6EwWH+6Q/xDSDPU4V+TF+uRG1xab0teIqwRStsenhw3TYXSrUxbhx18E6kTl
                    JHnN1omBvIWXiRjgOGtwmGsNT+q/ey0LlU/doc+Gz96T7VjfyCtuB36GpbY92du5
                    9Bt8AjdjriM+brZA2acSnl7eBBmA8hgSJ+wHwHpgGTNdWGigYfzG+zlJmKa+gRrQ
                    ytSOYVLWeqPTqRCc3zfvw2j7ygZa4dnlsQddsoqIUyBZtYgRKaZQwytS+Q18EY1A
                    6wIDAQAB
                    -----END PUBLIC KEY-----
      responses:
        '200':
          description: Installation created successfully
          headers:
            X-Bunq-Server-Signature:
              description: Server signature to verify response authenticity
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          $ref: '#/components/schemas/Id'
                        Token:
                          $ref: '#/components/schemas/InstallationToken'
                        ServerPublicKey:
                          $ref: '#/components/schemas/InstallationServerPublicKey'
        '400':
          description: Bad request - invalid public key format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Authentication
      summary: Get Installation Details
      description: Check if provided ID is your current installation ID
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: Installation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'

  /device-server:
    post:
      tags:
      - Authentication
      summary: Create Device Server
      description: |
        Register a new device server using your installation token.
        The API key will be bound to the specified IP addresses.

        **Wildcard API Keys**: Allow API calls even after IP address changes.
        Learn more: https://bunq.com/en/apikey-dynamic-ip
      security:
      - InstallationAuth: []
      - ClientSignature: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - description
              - secret
              properties:
                description:
                  type: string
                  description: Device description for your reference
                  example: "Partner Server v1.0"
                secret:
                  type: string
                  description: Your API key from bunq app
                  example: "e359370ebb0cf7e6923014aa8bee1f7df67245e3bfcb557faea0fee6e27192e1"
                permitted_ips:
                  type: array
                  description: IP addresses allowed to use this device (optional)
                  items:
                    type: string
                  example: ["127.0.0.1", "10.0.0.1"]
      responses:
        '200':
          description: Device server created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
        '400':
          description: Bad request - invalid API key or IP addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Authentication
      summary: List Device Servers
      description: Get all your registered device servers
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: List of device servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        DeviceServer:
                          $ref: '#/components/schemas/DeviceServer'
  /session-server:
    post:
      tags:
      - Authentication
      summary: Create Session
      description: |
        Create a new session for API access. Requires installation token and device server.
        Session expires based on your auto-logout setting (default: 1 week).

        **Note**: IP address must match the one bound to your API key.
      security:
      - InstallationAuth: []
      - ClientSignature: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  description: Your API key
                  example: "e359370ebb0cf7e6923014aa8bee1f7df67245e3bfcb557faea0fee6e27192e1"
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          $ref: '#/components/schemas/Id'
                        Token:
                          $ref: '#/components/schemas/SessionToken'
                        UserCompany:
                          type: object
                          description: Company user details (if applicable)
                        UserPerson:
                          type: object
                          description: Person user details (if applicable)
                        UserApiKey:
                          type: object
                          description: API key user details
        '400':
          description: Bad request - invalid API key or IP mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /oauth-client:
    post:
      tags:
      - OAuth Management
      summary: Create OAuth Client
      description: Create a new OAuth client for third-party integrations
      security:
      - SessionAuth: []
      - ClientSignature: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ACTIVE, CANCELLED]
                  example: "ACTIVE"
                  description: |
                    OAuth client status:
                    - `ACTIVE`: Client is active and can be used
                    - `CANCELLED`: Client is disabled and cannot be used
      responses:
        '200':
          description: OAuth client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Response:
                    type: array
